[package]
name = "discord-music-media-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
publish = false
license = "MIT"
description = "Private media extraction sidecar for Discord Music"
build = "build.rs"

[features]
default = []
test-upstream = []

[[bin]]
name = "media-sidecar-test-harness"
path = "src/bin/media-sidecar-test-harness.rs"
required-features = ["test-upstream"]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
bytes = "=1.12.1"
futures-util = "=0.3.34"
http-body-util = "=0.1.5"
nix = { version = "=0.31.3", default-features = false, features = ["process", "signal"] }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
scopeguard = "=1.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tower = { version = "=0.5.3", features = ["limit", "util"] }
tower-http = { version = "=0.7.1", features = ["limit", "sensitive-headers", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "std"] }
url = { version = "=2.5.8", features = ["serde"] }
uuid = { version = "=1.26.0", features = ["serde", "v4"] }

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
elided_lifetimes_in_paths = "warn"
non_ascii_idents = "deny"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
mem_forget = "deny"
arithmetic_side_effects = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
as_underscore = "deny"
as_ptr_cast_mut = "deny"
ptr_as_ptr = "warn"
borrow_as_ptr = "warn"
fn_to_numeric_cast_any = "deny"
clone_on_ref_ptr = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
exit = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
use_debug = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
mod_module_files = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
empty_enums = "warn"
exhaustive_enums = "warn"
exhaustive_structs = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = "line-tables-only"

[profile.dev]
opt-level = 0
debug = true
incremental = true
codegen-units = 256
split-debuginfo = "unpacked"

[profile.miri]
inherits = "test"
opt-level = 1
overflow-checks = true
