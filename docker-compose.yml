services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/discord-music.sqlite
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - music-data:/data
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        VITE_API_URL: ${PUBLIC_URL}
        BASE_PATH: ""
    ports:
      - "4173:8080"
    restart: unless-stopped

volumes:
  music-data:
